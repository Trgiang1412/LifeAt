<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Nền Squircle bo tròn hiện đại có viền Neon Cyan -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.45" />

  <!-- Dấu ấn Quỹ đạo tập trung (Focus Orbit) -->
  <ellipse cx="32" cy="33" rx="22" ry="11" fill="none" stroke="url(#glowGrad)" stroke-width="1.8" stroke-dasharray="3 2.5" stroke-opacity="0.5" transform="rotate(-25 32 33)" />

  <!-- Biểu tượng chữ 'L' cách điệu hiện đại (LifeAt Deep Focus Brandmark) -->
  <!-- Nhánh thẳng đứng vươn cao -->
  <path d="M19 14 C19 12.3 20.3 11 22 11 L25 11 C26.7 11 28 12.3 28 14 L28 36 C28 37.7 29.3 39 31 39 L44 39 C45.7 39 47 40.3 47 42 L47 45 C47 46.7 45.7 48 44 48 L22 48 C18.7 48 16 45.3 16 42 L16 17 C16 15.3 17.3 14 19 14 Z" fill="url(#glowGrad)" filter="url(#bloom)" />

  <!-- Ngôi sao Focus lấp lánh (Spark of Productivity) ở góc trên bên phải -->
  <path d="M43 12 C43 17 48 18 48 18 C48 18 43 19 43 24 C43 19 38 18 38 18 C38 18 43 17 43 12 Z" fill="url(#starGrad)" filter="url(#bloom)" />
  
  <!-- Hạt ánh sáng Focus phụ -->
  <circle cx="49" cy="34" r="2.2" fill="#38bdf8" filter="url(#bloom)" />
</svg>
